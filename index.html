
<!DOCTYPE html>
<html>
<head>
    <title>Student Average Calculator</title>
</head>
<body>

    <h2>Student Average Calculator</h2>

    <h3>Student 1</h3>
    <label>Student Name:</label>
    <input type="text" id="name1" placeholder="Enter student name">

    <br><br>

    <label>Mark 1:</label>
    <input type="number" id="mark1">

    <label>Mark 2:</label>
    <input type="number" id="mark2">

    <label>Mark 3:</label>
    <input type="number" id="mark3">


    <h3>Student 2</h3>
    <label>Student Name:</label>
    <input type="text" id="name2" placeholder="Enter student name">

    <br><br>

    <label>Mark 1:</label>
    <input type="number" id="mark4">

    <label>Mark 2:</label>
    <input type="number" id="mark5">

    <label>Mark 3:</label>
    <input type="number" id="mark6">


    <h3>Student 3</h3>
    <label>Student Name:</label>
    <input type="text" id="name3" placeholder="Enter student name">

    <br><br>

    <label>Mark 1:</label>
    <input type="number" id="mark7">

    <label>Mark 2:</label>
    <input type="number" id="mark8">

    <label>Mark 3:</label>
    <input type="number" id="mark9">

    <br><br>

    <button onclick="displayResults()">Calculate Averages</button>

    <div id="output"></div>


    <script>

        // Function to calculate student average
        function calculateAverage(mark1, mark2, mark3) {

            let total = mark1 + mark2 + mark3;

            let average = total / 3;

            return average;
        }


        // Function to display student results
        function displayResults() {

            // Get student 1 information
            let name1 = document.getElementById("name1").value;

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);


            // Get student 2 information
            let name2 = document.getElementById("name2").value;

            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);
            let mark6 = Number(document.getElementById("mark6").value);


            // Get student 3 information
            let name3 = document.getElementById("name3").value;

            let mark7 = Number(document.getElementById("mark7").value);
            let mark8 = Number(document.getElementById("mark8").value);
            let mark9 = Number(document.getElementById("mark9").value);


            // Calculate averages using the reusable function
            let average1 = calculateAverage(mark1, mark2, mark3);

            let average2 = calculateAverage(mark4, mark5, mark6);

            let average3 = calculateAverage(mark7, mark8, mark9);


            // Display results on the webpage
            document.getElementById("output").innerHTML =

                "<h2>Student Results</h2>" +

                "<p>" + name1 + " - Average: " + average1.toFixed(2) + "</p>" +

                "<p>" + name2 + " - Average: " + average2.toFixed(2) + "</p>" +

                "<p>" + name3 + " - Average: " + average3.toFixed(2) + "</p>";

        }

    </script>

</body>
</html>
